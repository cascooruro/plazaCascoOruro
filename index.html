<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gobierno Autónomo Municipal de Oruro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- ==========================================
         IMPORT MAP
    ========================================== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        /* ==============================
           GENERAL
        ============================== */
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        html, body{ width:100%; height:100%; }
        body{ overflow:hidden; background:#0b1d3a; }

        /* ==============================
           FONDO 3D
        ============================== */
        #modelo3d{ position:fixed; top:0; left:0; width:100%; height:100vh; z-index:0; }
        #modelo3d canvas { display: block; width: 100% !important; height: 100% !important; }

        /* ==============================
           OSCURECER EL MODELO
        ============================== */
        #oscuro{ position:fixed; inset:0; background:rgba(10,25,50,0.35); z-index:1; pointer-events:none; }

        /* ==============================
           NAVBAR
        ============================== */
        .navbar{
            position:absolute; top:20px; left:50%; transform:translateX(-50%);
            width:92%; padding:20px 40px; display:flex; justify-content:space-between;
            align-items:center; background:rgba(255,255,255,0.12);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            border-radius:25px; box-shadow:0 5px 25px rgba(0,0,0,.2); z-index:10;
            transition: opacity 0.5s ease;
        }

        /* ==============================
           LOGO
        ============================== */
        .logo{ display:flex; align-items:center; gap:20px; color:white; }
        .logo a{ display:flex; }
        .logo img{ width:90px; height:90px; object-fit:cover; border-radius:10px; }
        .logo h2{ font-size:2.2rem; font-weight:700; letter-spacing:2px; }

        /* ==============================
           MENU
        ============================== */
        .menu{ display:flex; gap:28px; }
        .menu a{ color:white; text-decoration:none; font-size:17px; font-weight:600; transition:.3s; }
        .menu a:hover{ color:#ffd700; }

        /* ==============================
           CONTENIDO
        ============================== */
        .contenido{
            position:absolute; top:55%; left:50%; transform:translate(-50%,-50%);
            width:90%; text-align:center; color:white; z-index:5; animation:aparecer 1.2s ease;
            transition: opacity 0.5s ease;
        }
        .contenido h3{ font-size:32px; color:#ffd700; margin-bottom:10px; text-shadow:0 3px 15px rgba(0,0,0,.9); }
        .contenido h1{ font-size:75px; line-height:1.2; font-weight:800; text-shadow:0 5px 20px rgba(0,0,0,.9); }
        .contenido p{ margin-top:15px; font-size:22px; text-shadow:0 3px 12px rgba(0,0,0,.9); }

        /* ==============================
           BOTONES
        ============================== */
        .botones{ margin-top:35px; display:flex; justify-content:center; gap:20px; }
        .btn{ text-decoration:none; padding:15px 35px; border-radius:50px; font-size:18px; font-weight:600; transition:.3s ease; border:none; cursor:pointer; }
        .btn:hover{ transform:translateY(-3px); }
        .btn1{ background:#f5b400; color:black; }
        .btn1:hover{ background:#ffca28; }

        /* GUÍA DE NAVEGACIÓN ESTILO PERSONAJE */
        #guia-teclado{
            display: none; position: fixed; top: 20px; right: 20px; z-index: 20;
            background: rgba(10,25,50,0.85); color: white; padding: 14px 22px;
            border-radius: 12px; font-size: 14px; backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* PANTALLA DE PAUSA */
        #pantalla-pausa{
            display: none; position: fixed; inset: 0; background: rgba(10,20,40,0.85);
            z-index: 30; color: white; justify-content: center; align-items: center;
            flex-direction: column; text-align: center;
        }
        #pantalla-pausa h2 { font-size: 40px; color: #ffd700; margin-bottom: 20px;}
        #pantalla-pausa button { padding: 10px 30px; font-size: 18px; cursor: pointer; border-radius: 30px; border: none; background: white; color: black; font-weight: bold;}

        @keyframes aparecer{
            from{ opacity:0; transform:translate(-50%,-40%); }
            to{ opacity:1; transform:translate(-50%,-50%); }
        }

        @media(max-width:900px){
            .navbar{ flex-direction:column; gap:15px; padding:20px; }
            .menu{ flex-wrap:wrap; justify-content:center; gap:15px; }
            .contenido{ width:90%; }
            .contenido h1{ font-size:50px; }
        }
    </style>
</head>

<body>

<!-- FONDO 3D -->
<div id="modelo3d"></div>
<div id="oscuro"></div>

<!-- MENU -->
<nav class="navbar" id="navbar">
    <div class="logo">
        <a href="inicio.html"><img src="casco.png" alt="Logo Oruro"></a>
        <h2>ORURO</h2>
    </div>
    <div class="menu">
        <a href="index.html">INICIO</a>
        <a href="historia.html">HISTORIA</a>
        <a href="cultura.html">CULTURA</a>
    </div>
</nav>

<!-- CONTENIDO PRINCIPAL -->
<div class="contenido" id="contenido">
    <h3>Patrimonio Histórico</h3>
    <h1>MONUMENTO<br>AL CASCO<br>DEL MINERO</h1>
    <p>Símbolo de la identidad minera de Oruro</p>
    <div class="botones">
        <button id="btn-explorar" class="btn btn1">Entrar a explorar</button>
    </div>
</div>

<!-- INDICADOR DE CONTROL -->
<div id="guia-teclado">
    🚶‍♂️ <b>WASD:</b> Caminar<br>
    🖱️ <b>Mouse:</b> Girar cabeza / Elevar vista<br>
    ❌ <b>ESC:</b> Pausar / Salir
</div>

<!-- PANTALLA DE PAUSA -->
<div id="pantalla-pausa">
    <h2>EXPLORACIÓN PAUSADA</h2>
    <p style="margin-bottom: 20px;">Haz clic para continuar explorando, o vuelve al menú.</p>
    <div style="display: flex; gap: 15px;">
        <button id="btn-continuar" style="background:#f5b400;">Continuar explorando</button>
        <button id="btn-salir">Volver al Menú</button>
    </div>
</div>

<!-- ==========================================
     THREE.JS
========================================== -->
<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    /* CONFIGURACIÓN BÁSICA */
    const contenedor = document.getElementById("modelo3d");
    const escena = new THREE.Scene();
    
    const colorCielo = 0x0f2b48;
    escena.background = new THREE.Color(colorCielo);
    escena.fog = new THREE.FogExp2(colorCielo, 0.012);

    /* ALTURAS DE CÁMARA */
    const ALTURA_SUELO = 0.3; // Para explorar
    
    const camara = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // Posición inicial en el MENÚ: Elevada y desplazada de lado para dar perspectiva 3D
    camara.position.set(4, 2.5, 9); 
    camara.lookAt(0, 1.5, 0);

    const renderizador = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderizador.setSize(window.innerWidth, window.innerHeight);
    renderizador.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderizador.outputColorSpace = THREE.SRGBColorSpace;
    contenedor.appendChild(renderizador.domElement);

    /* PLATAFORMA (Piso) */
    const geometriaSuelo = new THREE.PlaneGeometry(120, 120);
    const materialSuelo = new THREE.MeshStandardMaterial({ color: 0x12243b, roughness: 0.7 });
    const suelo = new THREE.Mesh(geometriaSuelo, materialSuelo);
    suelo.rotation.x = -Math.PI / 2; 
    suelo.position.y = 0;
    escena.add(suelo);

    const rejilla = new THREE.GridHelper(120, 60, 0x00d2ff, 0x1e3e62);
    rejilla.position.y = 0.001;
    escena.add(rejilla);

    /* CONTROLES FIRST-PERSON */
    const controles = new PointerLockControls(camara, document.body);

    const teclas = { w: false, s: false, a: false, d: false };

    window.addEventListener("keydown", (e) => {
        if(e.code === "KeyW" || e.code === "ArrowUp") teclas.w = true;
        if(e.code === "KeyS" || e.code === "ArrowDown") teclas.s = true;
        if(e.code === "KeyA" || e.code === "ArrowLeft") teclas.a = true;
        if(e.code === "KeyD" || e.code === "ArrowRight") teclas.d = true;
    });

    window.addEventListener("keyup", (e) => {
        if(e.code === "KeyW" || e.code === "ArrowUp") teclas.w = false;
        if(e.code === "KeyS" || e.code === "ArrowDown") teclas.s = false;
        if(e.code === "KeyA" || e.code === "ArrowLeft") teclas.a = false;
        if(e.code === "KeyD" || e.code === "ArrowRight") teclas.d = false;
    });

    /* PARTÍCULAS */
    const cantidadParticulas = 600;
    const geometriaParticulas = new THREE.BufferGeometry();
    const posiciones = new Float32Array(cantidadParticulas * 3);

    for (let i = 0; i < cantidadParticulas * 3; i += 3) {
        posiciones[i]     = (Math.random() - 0.5) * 60;
        posiciones[i + 1] = (Math.random() * 25);
        posiciones[i + 2] = (Math.random() - 0.5) * 60;
    }

    geometriaParticulas.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
    const materialParticulas = new THREE.PointsMaterial({ color: 0xffd700, size: 0.05, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
    const sistemaParticulas = new THREE.Points(geometriaParticulas, materialParticulas);
    escena.add(sistemaParticulas);

    /* LUCES */
    const luzAmbiente = new THREE.AmbientLight(0xffffff, 2.0);
    escena.add(luzAmbiente);

    const luzPrincipal = new THREE.DirectionalLight(0xfffaed, 3.5);
    luzPrincipal.position.set(10, 20, 10);
    escena.add(luzPrincipal);

    const luzDorada = new THREE.PointLight(0xffc107, 8, 25);
    luzDorada.position.set(0, 4, 3);
    escena.add(luzDorada);

    /* CARGADOR GLB */
    let contenedorCasco = null;
    const cargador = new GLTFLoader();

    cargador.load(
        "trabajo3.glb", 
        function(modelo){
            const casco = modelo.scene;
            
            const caja = new THREE.Box3().setFromObject(casco);
            const centro = caja.getCenter(new THREE.Vector3());
            const tamaño = caja.getSize(new THREE.Vector3());

            casco.position.x = -centro.x;
            casco.position.y = -caja.min.y;
            casco.position.z = -centro.z;

            contenedorCasco = new THREE.Group();
            contenedorCasco.add(casco);

            const tamañoDeseado = 7; 
            const tamañoMaximo = Math.max(tamaño.x, tamaño.y, tamaño.z);
            const escala = tamañoDeseado / tamañoMaximo;
            contenedorCasco.scale.setScalar(escala);

            contenedorCasco.position.set(0, 0, 0); 
            // Orientación lateral inicial
            contenedorCasco.rotation.y = Math.PI * 0.35;
            escena.add(contenedorCasco);
        }
    );

    /* LÓGICA DE INTERFAZ */
    const btnExplorar = document.getElementById("btn-explorar");
    const btnContinuar = document.getElementById("btn-continuar");
    const btnSalir = document.getElementById("btn-salir");
    const guiaTeclado = document.getElementById("guia-teclado");
    const contenido = document.getElementById("contenido");
    const navbar = document.getElementById("navbar");
    const oscuro = document.getElementById("oscuro");
    const pantallaPausa = document.getElementById("pantalla-pausa");

    let explorando = false;

    btnExplorar.addEventListener("click", () => { 
        // AL ENTRAR A EXPLORAR: Posicionamos la cámara al frente y al nivel del suelo
        camara.position.set(0, ALTURA_SUELO, 11);
        camara.lookAt(0, ALTURA_SUELO, 0);
        controles.lock(); 
    });
    
    btnContinuar.addEventListener("click", () => { controles.lock(); });

    controles.addEventListener('lock', () => {
        explorando = true;
        camara.position.y = ALTURA_SUELO;
        contenido.style.display = "none";
        navbar.style.display = "none";
        oscuro.style.display = "none";
        pantallaPausa.style.display = "none";
        guiaTeclado.style.display = "block";
    });

    controles.addEventListener('unlock', () => {
        if(explorando){
            pantallaPausa.style.display = "flex";
            guiaTeclado.style.display = "none";
        }
    });

    btnSalir.addEventListener("click", () => {
        explorando = false;
        pantallaPausa.style.display = "none";
        contenido.style.display = "block";
        navbar.style.display = "flex";
        oscuro.style.display = "block";
        
        // AL VOLVER AL MENÚ: Restauramos la vista elevada de lado
        camara.position.set(4, 2.5, 9);
        camara.lookAt(0, 1.5, 0);
    });

    /* MOVIMIENTO DE PERSONAJE */
    const vectorVelocidad = new THREE.Vector3();
    const vectorDireccion = new THREE.Vector3();
    let tiempoAnterior = performance.now();

    function animar(){
        requestAnimationFrame(animar);
        
        const tiempoActual = performance.now();
        const delta = (tiempoActual - tiempoAnterior) / 1000;

        if(controles.isLocked){
            vectorVelocidad.x -= vectorVelocidad.x * 10.0 * delta;
            vectorVelocidad.z -= vectorVelocidad.z * 10.0 * delta;

            vectorDireccion.z = Number(teclas.w) - Number(teclas.s);
            vectorDireccion.x = Number(teclas.d) - Number(teclas.a);
            vectorDireccion.normalize();

            const velocidadMovimiento = 40.0;

            if (teclas.w || teclas.s) vectorVelocidad.z -= vectorDireccion.z * velocidadMovimiento * delta;
            if (teclas.a || teclas.d) vectorVelocidad.x -= vectorDireccion.x * velocidadMovimiento * delta;

            controles.moveRight(-vectorVelocidad.x * delta);
            controles.moveForward(-vectorVelocidad.z * delta);

            camara.position.y = ALTURA_SUELO; 
        } else if (!explorando) {
            // Mantener vista enfocada al centro en el Menú de Inicio
            camara.lookAt(0, 1.5, 0);
            if (contenedorCasco) {
                contenedorCasco.rotation.y += 0.0015;
            }
        }

        sistemaParticulas.rotation.y += 0.0005;
        
        tiempoAnterior = tiempoActual;
        renderizador.render(escena, camara);
    }

    animar();

    /* RESPONSIVE */
    window.addEventListener("resize", function(){
        camara.aspect = window.innerWidth / window.innerHeight;
        camara.updateProjectionMatrix();
        renderizador.setSize(window.innerWidth, window.innerHeight);
    });

</script>

</body>
</html>
